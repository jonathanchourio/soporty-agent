[package]
name = "soporty-agent"
version = "1.0.0"
description = "Soporty Agente — equipos administrados (soporte remoto desatendido)"
authors = ["Jonathan Josue Chourio Gonzalez"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "soporty_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
